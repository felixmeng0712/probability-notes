<text x="470.0" y="50.0" font-size="16" fill="#333" text-anchor="start" dominant-baseline="central" font-weight="bold" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">n = 8 个元素随机排成一圈，k = 3</text>
<text x="470.0" y="92.0" font-size="15" fill="#2f6fd6" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">蓝弧 A：族中的一个“连续 3 段”</text>
<text x="470.0" y="134.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">与 A 相交的弧，都在 A 内部某个缝处“切开”A</text>
<text x="470.0" y="170.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">A 内部只有 k−1 = 2 个缝：</text>
<text x="470.0" y="206.0" font-size="15" fill="#e07b16" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">橙色一对：在第 1 个缝处切开 A</text>
<text x="470.0" y="242.0" font-size="15" fill="#2a9d4b" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">绿色一对：在第 2 个缝处切开 A</text>
<text x="470.0" y="284.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">同一对的两条弧互不相交（因为 n ≥ 2k）</text>
<text x="470.0" y="320.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">⇒ 每一对至多一条在族中</text>
<text x="470.0" y="362.0" font-size="16" fill="#333" text-anchor="start" dominant-baseline="central" font-weight="bold" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">⇒ 族中的连续弧至多 1 + (k−1) = k 条</text></svg>