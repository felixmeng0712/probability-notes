<svg xmlns="http://www.w3.org/2000/svg" width="940" height="300" viewBox="0 0 940 300" role="img"><title>对称随机游走：吸收于 0 和 N</title><rect width="940" height="300" fill="#ffffff"/><style>text{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",Arial,sans-serif}</style><defs></defs><line x1="116.0" y1="150.0" x2="189.0" y2="150.0" stroke="#d0d0d0" stroke-width="2" stroke-linecap="round" opacity="1"/>
<line x1="241.0" y1="150.0" x2="314.0" y2="150.0" stroke="#d0d0d0" stroke-width="2" stroke-linecap="round" opacity="1"/>
<line x1="366.0" y1="150.0" x2="439.0" y2="150.0" stroke="#d0d0d0" stroke-width="2" stroke-linecap="round" opacity="1"/>
<line x1="491.0" y1="150.0" x2="564.0" y2="150.0" stroke="#d0d0d0" stroke-width="2" stroke-linecap="round" opacity="1"/>
<line x1="616.0" y1="150.0" x2="689.0" y2="150.0" stroke="#d0d0d0" stroke-width="2" stroke-linecap="round" opacity="1"/>
<line x1="741.0" y1="150.0" x2="814.0" y2="150.0" stroke="#d0d0d0" stroke-width="2" stroke-linecap="round" opacity="1"/>
<path d="M473.0,125.0 Q527.5,65.0 582.0,125.0" stroke="#2f6fd6" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="1"/>
<path d="M457.0,125.0 Q402.5,65.0 348.0,125.0" stroke="#2f6fd6" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="1"/>
<line x1="582.0" y1="125.0" x2="568.0" y2="120.0" stroke="#2f6fd6" stroke-width="2.6" stroke-linecap="round" opacity="1"/>
<line x1="348.0" y1="125.0" x2="362.0" y2="120.0" stroke="#2f6fd6" stroke-width="2.6" stroke-linecap="round" opacity="1"/>
<circle cx="90.0" cy="150.0" r="24" fill="#2a9d4b22" stroke="#2a9d4b" stroke-width="2"/>
<text x="90.0" y="150.0" font-size="14" fill="#2a9d4b" text-anchor="middle" dominant-baseline="central">0</text>
<circle cx="215.0" cy="150.0" r="24" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="215.0" y="150.0" font-size="14" fill="#333" text-anchor="middle" dominant-baseline="central">1</text>
<circle cx="340.0" cy="150.0" r="24" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="340.0" y="150.0" font-size="14" fill="#333" text-anchor="middle" dominant-baseline="central">k−1</text>
<circle cx="465.0" cy="150.0" r="24" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="465.0" y="150.0" font-size="14" fill="#333" text-anchor="middle" dominant-baseline="central">k</text>
<circle cx="590.0" cy="150.0" r="24" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="590.0" y="150.0" font-size="14" fill="#333" text-anchor="middle" dominant-baseline="central">k+1</text>
<circle cx="715.0" cy="150.0" r="24" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="715.0" y="150.0" font-size="14" fill="#333" text-anchor="middle" dominant-baseline="central">N−1</text>
<circle cx="840.0" cy="150.0" r="24" fill="#2a9d4b22" stroke="#2a9d4b" stroke-width="2"/>
<text x="840.0" y="150.0" font-size="14" fill="#2a9d4b" text-anchor="middle" dominant-baseline="central">N</text>
<text x="527.5" y="82.0" font-size="15" fill="#2f6fd6" text-anchor="middle" dominant-baseline="central" font-weight="bold" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1/2</text>
<text x="402.5" y="82.0" font-size="15" fill="#2f6fd6" text-anchor="middle" dominant-baseline="central" font-weight="bold" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1/2</text>
<text x="90.0" y="192.0" font-size="14" fill="#2a9d4b" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">输光，停止</text>
<text x="840.0" y="192.0" font-size="14" fill="#2a9d4b" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">赢到 N，停止</text>
<text x="470.0" y="30.0" font-size="17" fill="#333" text-anchor="middle" dominant-baseline="central" font-weight="bold" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">从 k 出发，每步向左或向右各 1/2</text>
<text x="470.0" y="238.0" font-size="15" fill="#333" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">p<tspan dy="4.5" font-size="10.8">k</tspan><tspan dy="-4.5">​</tspan> = (p<tspan dy="4.5" font-size="10.8">k−1</tspan><tspan dy="-4.5">​</tspan> + p<tspan dy="4.5" font-size="10.8">k+1</tspan><tspan dy="-4.5">​</tspan>) / 2：每个中间点的值是两个邻居的平均</text>
<text x="470.0" y="270.0" font-size="15" fill="#333" text-anchor="middle" dominant-baseline="central" font-weight="bold" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">⇒ 相邻差相等，p<tspan dy="4.5" font-size="10.8">k</tspan><tspan dy="-4.5">​</tspan> 是 k 的一次函数；再用 p<tspan dy="4.5" font-size="10.8">0</tspan><tspan dy="-4.5">​</tspan> = 0，p<tspan dy="4.5" font-size="10.8">N</tspan><tspan dy="-4.5">​</tspan> = 1 定出 p<tspan dy="4.5" font-size="10.8">k</tspan><tspan dy="-4.5">​</tspan> = k/N</text></svg>