<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330" role="img"><title>下降位示性变量：相邻相关，不相交独立</title><rect width="980" height="330" fill="#ffffff"/><style>text{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",Arial,sans-serif}</style><defs></defs><path d="M80.0,164.0 Q130.0,80.0 180.0,164.0" stroke="#2f6fd6" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="1"/>
<path d="M200.0,164.0 Q250.0,80.0 300.0,164.0" stroke="#e07b16" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="1"/>
<path d="M510.0,164.0 Q555.0,85.0 600.0,164.0" stroke="#2f6fd6" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="1"/>
<path d="M810.0,164.0 Q855.0,85.0 900.0,164.0" stroke="#2a9d4b" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="1"/>
<circle cx="70.0" cy="190.0" r="27" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="70.0" y="190.0" font-size="15" fill="#333" text-anchor="middle" dominant-baseline="central">a<tspan dy="4.5" font-size="10.8">i</tspan><tspan dy="-4.5">​</tspan></text>
<circle cx="190.0" cy="190.0" r="27" fill="#d43c3c22" stroke="#d43c3c" stroke-width="2"/>
<text x="190.0" y="190.0" font-size="15" fill="#d43c3c" text-anchor="middle" dominant-baseline="central">a<tspan dy="4.5" font-size="10.8">i+1</tspan><tspan dy="-4.5">​</tspan></text>
<circle cx="310.0" cy="190.0" r="27" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="310.0" y="190.0" font-size="15" fill="#333" text-anchor="middle" dominant-baseline="central">a<tspan dy="4.5" font-size="10.8">i+2</tspan><tspan dy="-4.5">​</tspan></text>
<text x="130.0" y="98.0" font-size="16" fill="#2f6fd6" text-anchor="middle" dominant-baseline="central" font-weight="bold" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">I<tspan dy="4.8" font-size="11.5">i</tspan><tspan dy="-4.8">​</tspan></text>
<text x="250.0" y="98.0" font-size="16" fill="#e07b16" text-anchor="middle" dominant-baseline="central" font-weight="bold" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">I<tspan dy="4.8" font-size="11.5">i+1</tspan><tspan dy="-4.8">​</tspan></text>
<text x="190.0" y="30.0" font-size="18" fill="#333" text-anchor="middle" dominant-baseline="central" font-weight="bold" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">相邻：共用 a<tspan dy="5.4" font-size="13.0">i+1</tspan><tspan dy="-5.4">​</tspan></text>
<text x="190.0" y="262.0" font-size="15" fill="#333" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">两个都下降 ⇔ a<tspan dy="4.5" font-size="10.8">i</tspan><tspan dy="-4.5">​</tspan> > a<tspan dy="4.5" font-size="10.8">i+1</tspan><tspan dy="-4.5">​</tspan> > a<tspan dy="4.5" font-size="10.8">i+2</tspan><tspan dy="-4.5">​</tspan></text>
<text x="190.0" y="292.0" font-size="15" fill="#d43c3c" text-anchor="middle" dominant-baseline="central" font-weight="bold" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">概率 1/6 ≠ 1/4，相关</text>
<circle cx="500.0" cy="190.0" r="27" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="500.0" y="190.0" font-size="15" fill="#333" text-anchor="middle" dominant-baseline="central">a<tspan dy="4.5" font-size="10.8">i</tspan><tspan dy="-4.5">​</tspan></text>
<circle cx="610.0" cy="190.0" r="27" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="610.0" y="190.0" font-size="15" fill="#333" text-anchor="middle" dominant-baseline="central">a<tspan dy="4.5" font-size="10.8">i+1</tspan><tspan dy="-4.5">​</tspan></text>
<circle cx="800.0" cy="190.0" r="27" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="800.0" y="190.0" font-size="15" fill="#333" text-anchor="middle" dominant-baseline="central">a<tspan dy="4.5" font-size="10.8">j</tspan><tspan dy="-4.5">​</tspan></text>
<circle cx="910.0" cy="190.0" r="27" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="910.0" y="190.0" font-size="15" fill="#333" text-anchor="middle" dominant-baseline="central">a<tspan dy="4.5" font-size="10.8">j+1</tspan><tspan dy="-4.5">​</tspan></text>
<text x="705.0" y="190.0" font-size="18" fill="#9a9a9a" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">……</text>
<text x="555.0" y="102.0" font-size="16" fill="#2f6fd6" text-anchor="middle" dominant-baseline="central" font-weight="bold" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">I<tspan dy="4.8" font-size="11.5">i</tspan><tspan dy="-4.8">​</tspan></text>
<text x="855.0" y="102.0" font-size="16" fill="#2a9d4b" text-anchor="middle" dominant-baseline="central" font-weight="bold" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">I<tspan dy="4.8" font-size="11.5">j</tspan><tspan dy="-4.8">​</tspan></text>
<text x="705.0" y="30.0" font-size="18" fill="#333" text-anchor="middle" dominant-baseline="central" font-weight="bold" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">不相交：j ≥ i+2</text>
<text x="705.0" y="262.0" font-size="15" fill="#333" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">四个数的 24 种相对顺序等可能</text>
<text x="705.0" y="292.0" font-size="15" fill="#2a9d4b" text-anchor="middle" dominant-baseline="central" font-weight="bold" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">两个都下降的有 6 种，概率 1/4 = 1/2 × 1/2，独立</text></svg>