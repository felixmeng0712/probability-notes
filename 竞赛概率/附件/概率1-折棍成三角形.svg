<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img"><title>折棍问题：能组成三角形的区域</title><rect width="820" height="440" fill="#ffffff"/><style>text{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",Arial,sans-serif}</style><defs></defs><polygon points="90.0,230.0 240.0,230.0 240.0,80.0" fill="#2f6fd6" fill-opacity="0.35" stroke="none"/>
<polygon points="240.0,380.0 240.0,230.0 390.0,230.0" fill="#e07b16" fill-opacity="0.35" stroke="none"/>
<line x1="90.0" y1="380.0" x2="390.0" y2="380.0" stroke="#333" stroke-width="2" stroke-linecap="round" opacity="1"/>
<line x1="390.0" y1="380.0" x2="390.0" y2="80.0" stroke="#333" stroke-width="2" stroke-linecap="round" opacity="1"/>
<line x1="390.0" y1="80.0" x2="90.0" y2="80.0" stroke="#333" stroke-width="2" stroke-linecap="round" opacity="1"/>
<line x1="90.0" y1="80.0" x2="90.0" y2="380.0" stroke="#333" stroke-width="2" stroke-linecap="round" opacity="1"/>
<line x1="240.0" y1="380.0" x2="240.0" y2="80.0" stroke="#9a9a9a" stroke-width="1.3" stroke-linecap="round" opacity="1" stroke-dasharray="5 4"/>
<line x1="90.0" y1="230.0" x2="390.0" y2="230.0" stroke="#9a9a9a" stroke-width="1.3" stroke-linecap="round" opacity="1" stroke-dasharray="5 4"/>
<line x1="90.0" y1="380.0" x2="390.0" y2="80.0" stroke="#9a9a9a" stroke-width="1.3" stroke-linecap="round" opacity="1" stroke-dasharray="2 4"/>
<text x="90.0" y="400.0" font-size="15" fill="#333" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0</text>
<text x="240.0" y="400.0" font-size="15" fill="#333" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1/2</text>
<text x="390.0" y="400.0" font-size="15" fill="#333" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1</text>
<text x="66.0" y="230.0" font-size="15" fill="#333" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1/2</text>
<text x="74.0" y="80.0" font-size="15" fill="#333" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1</text>
<text x="315.0" y="426.0" font-size="15" fill="#333" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">x（第一个切点）</text>
<text x="90.0" y="58.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">y（第二个切点）</text>
<text x="198.0" y="182.0" font-size="15" fill="#2f6fd6" text-anchor="middle" dominant-baseline="central" font-weight="bold" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">x &lt; y</text>
<text x="288.0" y="272.0" font-size="15" fill="#e07b16" text-anchor="middle" dominant-baseline="central" font-weight="bold" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">x > y</text>
<text x="450.0" y="90.0" font-size="16" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">x &lt; y 时三段长为 x，y−x，1−y</text>
<text x="450.0" y="130.0" font-size="16" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">能组成三角形 ⇔ 每段都小于 1/2</text>
<text x="450.0" y="170.0" font-size="16" fill="#2f6fd6" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">⇔ x &lt; 1/2，y > 1/2，y−x &lt; 1/2</text>
<text x="450.0" y="210.0" font-size="16" fill="#e07b16" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">x > y 的情形对称（橙色）</text>
<text x="450.0" y="270.0" font-size="16" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">两块阴影面积各 1/8</text>
<text x="450.0" y="310.0" font-size="18" fill="#333" text-anchor="start" dominant-baseline="central" font-weight="bold" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">所求概率 = 1/4</text></svg>