<circle cx="230.0" cy="70.0" r="19" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="230.0" y="70.0" font-size="16" fill="#333" text-anchor="middle" dominant-baseline="central">6</text>
<circle cx="360.0" cy="130.0" r="19" fill="#2a9d4b" stroke="#2a9d4b" stroke-width="2"/>
<text x="360.0" y="130.0" font-size="16" fill="#fff" text-anchor="middle" dominant-baseline="central">1</text>
<circle cx="120.0" cy="270.0" r="19" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="120.0" y="270.0" font-size="16" fill="#333" text-anchor="middle" dominant-baseline="central">5</text>
<circle cx="260.0" cy="220.0" r="19" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="260.0" y="220.0" font-size="16" fill="#333" text-anchor="middle" dominant-baseline="central">7</text>
<circle cx="390.0" cy="300.0" r="19" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="390.0" y="300.0" font-size="16" fill="#333" text-anchor="middle" dominant-baseline="central">4</text>
<circle cx="250.0" cy="340.0" r="19" fill="#2a9d4b" stroke="#2a9d4b" stroke-width="2"/>
