<line x1="136.7" y1="279.0" x2="233.3" y2="331.0" stroke="#9a9a9a" stroke-width="2" stroke-linecap="round" opacity="1"/>
<line x1="258.4" y1="238.9" x2="251.6" y2="321.1" stroke="#9a9a9a" stroke-width="2" stroke-linecap="round" opacity="1"/>
<line x1="371.7" y1="305.2" x2="268.3" y2="334.8" stroke="#9a9a9a" stroke-width="2" stroke-linecap="round" opacity="1"/>
