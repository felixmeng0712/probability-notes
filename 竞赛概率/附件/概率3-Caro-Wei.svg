<text x="480.0" y="60.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">数字：该点在随机顺序中的位置</text>
<text x="480.0" y="96.0" font-size="15" fill="#2a9d4b" text-anchor="start" dominant-baseline="central" font-weight="bold" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">绿色：比所有邻点都早出现的点</text>
<text x="480.0" y="150.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">两个相邻的点不可能都比对方早</text>
<text x="480.0" y="184.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">⇒ 绿色点两两不相邻，是独立集</text>
<text x="480.0" y="238.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">点 v 变绿 ⇔ 在 v 和它的 d<tspan dy="4.5" font-size="10.8">v</tspan><tspan dy="-4.5">​</tspan> 个邻点中 v 最早</text>
<text x="480.0" y="272.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">概率 1/(d<tspan dy="4.5" font-size="10.8">v</tspan><tspan dy="-4.5">​</tspan> + 1)</text>
<text x="480.0" y="320.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" font-weight="bold" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">⇒ E(绿点数) = Σ 1/(d<tspan dy="4.5" font-size="10.8">v</tspan><tspan dy="-4.5">​</tspan> + 1)，所以 α(G) ≥ Σ 1/(d<tspan dy="4.5" font-size="10.8">v</tspan><tspan dy="-4.5">​</tspan> + 1)</text></svg>