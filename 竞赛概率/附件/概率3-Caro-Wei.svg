<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380" role="img"><title>Caro–Wei：随机顺序中比所有邻点都早的点</title><rect width="940" height="380" fill="#ffffff"/><style>text{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",Arial,sans-serif}</style><defs></defs><line x1="108.3" y1="104.8" x2="211.7" y2="75.2" stroke="#9a9a9a" stroke-width="2" stroke-linecap="round" opacity="1"/>
