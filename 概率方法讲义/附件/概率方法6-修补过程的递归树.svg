<svg xmlns="http://www.w3.org/2000/svg" width="940" height="440" viewBox="0 0 940 440" role="img"><title>Moser 修补算法的一次运行：递归调用树与执行记录</title><rect width="940" height="440" fill="#ffffff"/><style>text{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",Arial,sans-serif}</style><defs><marker id="arr333" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><line x1="200.0" y1="82.0" x2="200.0" y2="136.0" stroke="#333" stroke-width="2.2" stroke-linecap="round" opacity="1" marker-end="url(#arr333)"/>
<line x1="200.0" y1="182.0" x2="200.0" y2="236.0" stroke="#333" stroke-width="2.2" stroke-linecap="round" opacity="1" marker-end="url(#arr333)"/>
<line x1="186.1" y1="277.0" x2="125.2" y2="351.4" stroke="#333" stroke-width="2.2" stroke-linecap="round" opacity="1" marker-end="url(#arr333)"/>
<line x1="213.9" y1="277.0" x2="274.8" y2="351.4" stroke="#333" stroke-width="2.2" stroke-linecap="round" opacity="1" marker-end="url(#arr333)"/>
<circle cx="200.0" cy="60.0" r="22" fill="#fff3e3" stroke="#e07b16" stroke-width="2"/>
<text x="200.0" y="60.0" font-size="14" fill="#333" text-anchor="middle" dominant-baseline="central">C<tspan dy="4.2" font-size="10.1">0</tspan><tspan dy="-4.2">​</tspan></text>
<circle cx="200.0" cy="160.0" r="22" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="200.0" y="160.0" font-size="14" fill="#333" text-anchor="middle" dominant-baseline="central">C<tspan dy="4.2" font-size="10.1">7</tspan><tspan dy="-4.2">​</tspan></text>
<circle cx="200.0" cy="260.0" r="22" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="200.0" y="260.0" font-size="14" fill="#333" text-anchor="middle" dominant-baseline="central">C<tspan dy="4.2" font-size="10.1">4</tspan><tspan dy="-4.2">​</tspan></text>
<circle cx="110.0" cy="370.0" r="22" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="110.0" y="370.0" font-size="14" fill="#333" text-anchor="middle" dominant-baseline="central">C<tspan dy="4.2" font-size="10.1">7</tspan><tspan dy="-4.2">​</tspan></text>
<circle cx="290.0" cy="370.0" r="22" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="290.0" y="370.0" font-size="14" fill="#333" text-anchor="middle" dominant-baseline="central">C<tspan dy="4.2" font-size="10.1">2</tspan><tspan dy="-4.2">​</tspan></text>
<text x="290.0" y="60.0" font-size="14" fill="#e07b16" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">最初的调用</text>
<text x="60.0" y="160.0" font-size="14" fill="#9a9a9a" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">第 1 次递归</text>
<text x="450.0" y="35.0" font-size="16" fill="#333" text-anchor="start" dominant-baseline="central" font-weight="bold" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">执行记录</text>
<text x="680.0" y="35.0" font-size="16" fill="#333" text-anchor="start" dominant-baseline="central" font-weight="bold" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">编码</text>
<text x="450.0" y="70.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1. 调用 C<tspan dy="4.5" font-size="10.8">7</tspan><tspan dy="-4.5">​</tspan></text>
<text x="680.0" y="70.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0 + 序号</text>
<text x="450.0" y="104.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">2. 调用 C<tspan dy="4.5" font-size="10.8">4</tspan><tspan dy="-4.5">​</tspan></text>
<text x="680.0" y="104.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0 + 序号</text>
<text x="450.0" y="138.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">3. 调用 C<tspan dy="4.5" font-size="10.8">7</tspan><tspan dy="-4.5">​</tspan></text>
<text x="680.0" y="138.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0 + 序号</text>
<text x="450.0" y="172.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">4. 循环结束</text>
<text x="680.0" y="172.0" font-size="15" fill="#2f6fd6" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1</text>
<text x="450.0" y="206.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">5. 调用 C<tspan dy="4.5" font-size="10.8">2</tspan><tspan dy="-4.5">​</tspan></text>
<text x="680.0" y="206.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0 + 序号</text>
<text x="450.0" y="240.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">6. 循环结束</text>
<text x="680.0" y="240.0" font-size="15" fill="#2f6fd6" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1</text>
<text x="450.0" y="274.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">7. 循环结束</text>
<text x="680.0" y="274.0" font-size="15" fill="#2f6fd6" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1</text>
<text x="450.0" y="308.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">……</text>
<text x="450.0" y="360.0" font-size="14" fill="#9a9a9a" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">序号：被调用的子句在当前子句的邻居中排第几，</text>
<text x="450.0" y="385.0" font-size="14" fill="#9a9a9a" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">约 k−3 位；每次调用消耗 k 个随机位</text></svg>