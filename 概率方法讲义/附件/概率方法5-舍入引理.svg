<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" role="img"><title>舍入引理：在方块与子空间的交上移动</title><rect width="880" height="450" fill="#ffffff"/><style>text{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",Arial,sans-serif}</style><defs><marker id="arre07b16" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e07b16"/></marker></defs><polygon points="90.0,360.0 390.0,360.0 390.0,60.0 90.0,60.0" fill="#f2f2f2" fill-opacity="1" stroke="none"/>
