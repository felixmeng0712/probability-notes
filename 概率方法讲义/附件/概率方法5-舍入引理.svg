<text x="408.0" y="199.5" font-size="14" fill="#9a9a9a" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">a<tspan dy="4.2" font-size="10.1">1</tspan><tspan dy="-4.2">​</tspan></text>
<text x="250.5" y="42.0" font-size="14" fill="#9a9a9a" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">a<tspan dy="4.2" font-size="10.1">2</tspan><tspan dy="-4.2">​</tspan></text>
<circle cx="180.0" cy="180.0" r="7" fill="#333" stroke="#333" stroke-width="2"/>
<circle cx="390.0" cy="285.0" r="7" fill="#e07b16" stroke="#e07b16" stroke-width="2"/>
<circle cx="90.0" cy="135.0" r="5" fill="#2f6fd6" stroke="#2f6fd6" stroke-width="2"/>
<text x="220.0" y="132.0" font-size="14" fill="#333" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">a：两个坐标都不是 ±1</text>
<text x="404.0" y="263.0" font-size="14" fill="#e07b16" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">a<tspan dy="4.2" font-size="10.1">1</tspan><tspan dy="-4.2">​</tspan> = 1</text>
<text x="240.0" y="384.0" font-size="14" fill="#9a9a9a" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−1 ≤ a<tspan dy="4.2" font-size="10.1">1</tspan><tspan dy="-4.2">​</tspan>, a<tspan dy="4.2" font-size="10.1">2</tspan><tspan dy="-4.2">​</tspan> ≤ 1</text>
<text x="460.0" y="90.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">例：n = 1，m = 2，v<tspan dy="4.5" font-size="10.8">1</tspan><tspan dy="-4.5">​</tspan> = 1，v<tspan dy="4.5" font-size="10.8">2</tspan><tspan dy="-4.5">​</tspan> = 2</text>
<text x="500.0" y="135.0" font-size="15" fill="#2f6fd6" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">可行集：a<tspan dy="4.5" font-size="10.8">1</tspan><tspan dy="-4.5">​</tspan> + 2a<tspan dy="4.5" font-size="10.8">2</tspan><tspan dy="-4.5">​</tspan> = 0 与方块的交</text>
<text x="500.0" y="175.0" font-size="15" fill="#e07b16" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">沿 c = (2, −1) 移动，c<tspan dy="4.5" font-size="10.8">1</tspan><tspan dy="-4.5">​</tspan>v<tspan dy="4.5" font-size="10.8">1</tspan><tspan dy="-4.5">​</tspan> + c<tspan dy="4.5" font-size="10.8">2</tspan><tspan dy="-4.5">​</tspan>v<tspan dy="4.5" font-size="10.8">2</tspan><tspan dy="-4.5">​</tspan> = 0</text>
<text x="460.0" y="230.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">非 ±1 的坐标多于 n 个时，对应的向量</text>
<text x="460.0" y="256.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">线性相关，于是有一个只改动这些坐标、</text>
<text x="460.0" y="282.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">保持 Σ a<tspan dy="4.5" font-size="10.8">i</tspan><tspan dy="-4.5">​</tspan>v<tspan dy="4.5" font-size="10.8">i</tspan><tspan dy="-4.5">​</tspan> = 0 的方向。沿它走到</text>
<text x="460.0" y="308.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">方块的边界，又多一个坐标变成 ±1。</text></svg>