<circle cx="85.0" cy="285.0" r="19" stroke="#e07b16" stroke-width="3" fill="none"/>
<circle cx="285.0" cy="485.0" r="19" stroke="#e07b16" stroke-width="3" fill="none"/>
<circle cx="235.0" cy="235.0" r="19" stroke="#e07b16" stroke-width="3" fill="none"/>
<circle cx="335.0" cy="285.0" r="19" stroke="#2a9d4b" stroke-width="3" fill="none"/>
<circle cx="285.0" cy="135.0" r="19" stroke="#2a9d4b" stroke-width="3" fill="none"/>
<text x="285.0" y="285.0" font-size="20" fill="#2f6fd6" text-anchor="middle" dominant-baseline="central" font-weight="bold">v</text>
<text x="85.0" y="285.0" font-size="19" fill="#e07b16" text-anchor="middle" dominant-baseline="central" font-weight="bold">5</text>
<text x="285.0" y="485.0" font-size="19" fill="#e07b16" text-anchor="middle" dominant-baseline="central" font-weight="bold">5</text>
<text x="235.0" y="235.0" font-size="19" fill="#e07b16" text-anchor="middle" dominant-baseline="central" font-weight="bold">5</text>
<text x="335.0" y="285.0" font-size="19" fill="#2a9d4b" text-anchor="middle" dominant-baseline="central" font-weight="bold">7</text>
<text x="285.0" y="135.0" font-size="19" fill="#2a9d4b" text-anchor="middle" dominant-baseline="central" font-weight="bold">7</text>
<text x="560.0" y="110.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">蓝格 κ 填 v；浅蓝是 κ 的行和列，灰底是 κ 的宫。</text>
<text x="560.0" y="148.0" font-size="15" fill="#e07b16" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">v'<tspan dy="4.5" font-size="10.8">1</tspan><tspan dy="-4.5">​</tspan> = 5：行、列、宫里含 5 的格子是三个不同的格子</text>
<text x="560.0" y="186.0" font-size="15" fill="#e07b16" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">（橙圈），三者都排在 κ 后面的概率为 t³。</text>
<text x="560.0" y="224.0" font-size="15" fill="#2a9d4b" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">v'<tspan dy="4.5" font-size="10.8">2</tspan><tspan dy="-4.5">​</tspan> = 7：行里含 7 的格子落在 κ 的宫里，</text>
<text x="560.0" y="262.0" font-size="15" fill="#2a9d4b" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">它也就是宫里含 7 的格子，只涉及两个格子</text>
<text x="560.0" y="300.0" font-size="15" fill="#2a9d4b" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">（绿圈），概率为 t²。</text>
<text x="560.0" y="338.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">这样的数字只有 2(n − 1) 个：行与宫、列与宫</text>
<text x="560.0" y="376.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">的交各有 n − 1 个其他格子。</text>
<text x="560.0" y="414.0" font-size="15" fill="#9a9a9a" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">t 是 κ 的揭示时刻 y(κ)（y 越大越早揭示）。</text></svg>