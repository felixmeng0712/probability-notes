<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img"><title>数独计数：数字 v' 仍可填入 κ，需要它在 κ 的行、列、宫中的格子都排在 κ 之后</title><rect width="980" height="560" fill="#ffffff"/><style>text{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",Arial,sans-serif}</style><defs></defs><rect x="210.0" y="210.0" width="150.0" height="150.0" rx="0" fill="#9a9a9a" fill-opacity="0.1" stroke="none" stroke-width="2"/>
