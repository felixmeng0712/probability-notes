<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img"><title>习题 7：U, V 的四格表。Harris 不等式说对角两格之积不小于反对角两格之积</title><rect width="880" height="400" fill="#ffffff"/><style>text{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",Arial,sans-serif}</style><defs></defs><rect x="150" y="90" width="130" height="130" rx="4" fill="#dbe7fb" stroke="#fff" stroke-width="4"/>
<rect x="280" y="90" width="130" height="130" rx="4" fill="#fde3c8" stroke="#fff" stroke-width="4"/>
<rect x="150" y="220" width="130" height="130" rx="4" fill="#fde3c8" stroke="#fff" stroke-width="4"/>
<rect x="280" y="220" width="130" height="130" rx="4" fill="#dbe7fb" stroke="#fff" stroke-width="4"/>
<text x="215.0" y="139.0" font-size="24" fill="#2f6fd6" text-anchor="middle" dominant-baseline="central" font-weight="bold">τ</text>
<text x="215.0" y="175.0" font-size="14" fill="#333" text-anchor="middle" dominant-baseline="central">UV</text>
<text x="345.0" y="139.0" font-size="24" fill="#e07b16" text-anchor="middle" dominant-baseline="central" font-weight="bold">α</text>
<text x="345.0" y="175.0" font-size="14" fill="#333" text-anchor="middle" dominant-baseline="central">U 且非 V</text>
<text x="215.0" y="269.0" font-size="24" fill="#e07b16" text-anchor="middle" dominant-baseline="central" font-weight="bold">β</text>
<text x="215.0" y="305.0" font-size="14" fill="#333" text-anchor="middle" dominant-baseline="central">V 且非 U</text>
<text x="345.0" y="269.0" font-size="24" fill="#2f6fd6" text-anchor="middle" dominant-baseline="central" font-weight="bold">z</text>
<text x="345.0" y="305.0" font-size="14" fill="#333" text-anchor="middle" dominant-baseline="central">都不发生</text>
<text x="215.0" y="68.0" font-size="17" fill="#333" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">V</text>
<text x="345.0" y="68.0" font-size="17" fill="#333" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">非 V</text>
<text x="116.0" y="155.0" font-size="17" fill="#333" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">U</text>
<text x="116.0" y="285.0" font-size="17" fill="#333" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">非 U</text>
<text x="480.0" y="120.0" font-size="15" fill="#e07b16" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">橙色两格：U, V 恰好一个发生，</text>
<text x="480.0" y="146.0" font-size="15" fill="#e07b16" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">“恰有一个 A<tspan dy="4.5" font-size="10.8">i</tspan><tspan dy="-4.5">​</tspan> 发生”只能落在这里</text>
<text x="480.0" y="192.0" font-size="15" fill="#2f6fd6" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">蓝色两格：都发生 / 都不发生</text>
<text x="480.0" y="248.0" font-size="16" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Harris（U, V 递增）：zτ ≥ αβ</text>
<text x="480.0" y="280.0" font-size="15" fill="#9a9a9a" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">正相关把概率挤到对角线上，</text>
<text x="480.0" y="306.0" font-size="15" fill="#9a9a9a" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">α ≈ β 时 α + β 至多约 1/2</text></svg>