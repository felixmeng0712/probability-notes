<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" role="img"><title>三角形 pqr 面积 ≤ ε 当且仅当 r 落在直线 pq 周围的细带中</title><rect width="860" height="470" fill="#ffffff"/><style>text{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",Arial,sans-serif}</style><defs><marker id="arr333" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><clipPath id="sq"><rect x="60" y="50" width="370" height="370"/></clipPath>
<polygon clip-path="url(#sq)" points="-371.5,598.7 701.9,62.1 671.5,1.3 -401.9,537.9" fill="#fde3c8" stroke="none"/>
<line clip-path="url(#sq)" x1="-371.5" y1="598.7" x2="701.9" y2="62.1" stroke="#e07b16" stroke-width="1.6" stroke-dasharray="6,4"/>
<line clip-path="url(#sq)" x1="-401.9" y1="537.9" x2="671.5" y2="1.3" stroke="#e07b16" stroke-width="1.6" stroke-dasharray="6,4"/>
<line clip-path="url(#sq)" x1="-386.7" y1="568.3" x2="686.7" y2="31.7" stroke="#9a9a9a" stroke-width="1.5"/>
<rect x="60" y="50" width="370" height="370" rx="0" fill="none" stroke="#333" stroke-width="2"/>
<polygon points="150,300 330,210 270.7,262.4" fill="#2f6fd6" opacity="0.25"/>
<line x1="150.0" y1="300.0" x2="330.0" y2="210.0" stroke="#2f6fd6" stroke-width="3" stroke-linecap="round" opacity="1"/>
<line x1="375.0" y1="187.5" x2="390.2" y2="217.9" stroke="#333" stroke-width="1.6" stroke-linecap="round" opacity="1" marker-end="url(#arr333)"/>
<circle cx="150.0" cy="300.0" r="14" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="150.0" y="300.0" font-size="14" fill="#333" text-anchor="middle" dominant-baseline="central">p</text>
<circle cx="330.0" cy="210.0" r="14" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="330.0" y="210.0" font-size="14" fill="#333" text-anchor="middle" dominant-baseline="central">q</text>
<circle cx="270.7" cy="262.4" r="12" fill="#cfe0fb" stroke="#2f6fd6" stroke-width="2"/>
<text x="270.7" y="262.4" font-size="13" fill="#333" text-anchor="middle" dominant-baseline="central">r</text>
<text x="245.0" y="442.0" font-size="15" fill="#9a9a9a" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">单位正方形</text>
<text x="470.0" y="120.0" font-size="16" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">固定 p、q，记 |pq| = x：</text>
<text x="470.0" y="160.0" font-size="16" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">面积(pqr) ≤ ε ⇔ r 到直线 pq 的距离 ≤ 2ε/x</text>
<text x="470.0" y="210.0" font-size="16" fill="#e07b16" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">橙色细带：半宽 2ε/x（黑色箭头）</text>
<text x="470.0" y="250.0" font-size="16" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">正方形沿 pq 方向的投影长 ≤ √2，</text>
<text x="470.0" y="280.0" font-size="16" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">所以细带在正方形内的面积 ≤ 4√2·ε/x</text>
<text x="470.0" y="330.0" font-size="16" fill="#2f6fd6" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">x 越小细带越宽——但 p、q 很近</text>
<text x="470.0" y="360.0" font-size="16" fill="#2f6fd6" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">的概率本身很小（≤ πx²）</text></svg>