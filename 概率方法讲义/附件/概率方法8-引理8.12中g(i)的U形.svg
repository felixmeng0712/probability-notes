<text x="670.0" y="302.0" font-size="15" fill="#9b3fb5" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">μ 越大越低</text>
<text x="670.0" y="352.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">要 μ 大，才能让</text>
<text x="670.0" y="378.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">左端占主导</text></svg>