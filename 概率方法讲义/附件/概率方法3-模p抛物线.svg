<text x="470.0" y="140.0" font-size="16" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">y ≡ x² 是模 7 的抛物线，</text>
<text x="470.0" y="168.0" font-size="16" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">与每条直线至多交于两点：没有三点共线</text>
<text x="470.0" y="230.0" font-size="16" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">顶点都是整点，面积 = |D|/2，D 是非零整数，</text>
<text x="470.0" y="258.0" font-size="16" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">所以每个三角形的面积 ≥ 1/2</text>
<text x="470.0" y="310.0" font-size="16" fill="#e07b16" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">橙色三角形 P<tspan dy="4.8" font-size="11.5">1</tspan><tspan dy="-4.8">​</tspan> P<tspan dy="4.8" font-size="11.5">3</tspan><tspan dy="-4.8">​</tspan> P<tspan dy="4.8" font-size="11.5">4</tspan><tspan dy="-4.8">​</tspan>：面积恰为 1/2</text></svg>