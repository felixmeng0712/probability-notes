<svg xmlns="http://www.w3.org/2000/svg" width="940" height="440" viewBox="0 0 940 440" role="img"><title>Conlon–Fox–Sudakov：先生成星，再生成条件独立拷贝</title><rect width="940" height="440" fill="#ffffff"/><style>text{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",Arial,sans-serif}</style><defs></defs><line x1="180.0" y1="220.0" x2="420.0" y2="100.0" stroke="#2f6fd6" stroke-width="3.4" stroke-linecap="round" opacity="1"/>
<line x1="180.0" y1="220.0" x2="420.0" y2="220.0" stroke="#2f6fd6" stroke-width="3.4" stroke-linecap="round" opacity="1"/>
<line x1="180.0" y1="220.0" x2="420.0" y2="340.0" stroke="#2f6fd6" stroke-width="3.4" stroke-linecap="round" opacity="1"/>
<line x1="640.0" y1="160.0" x2="420.0" y2="100.0" stroke="#e07b16" stroke-width="3.4" stroke-linecap="round" opacity="1"/>
<line x1="640.0" y1="160.0" x2="420.0" y2="220.0" stroke="#e07b16" stroke-width="3.4" stroke-linecap="round" opacity="1"/>
<line x1="640.0" y1="280.0" x2="420.0" y2="220.0" stroke="#e07b16" stroke-width="3.4" stroke-linecap="round" opacity="1"/>
<line x1="640.0" y1="280.0" x2="420.0" y2="340.0" stroke="#e07b16" stroke-width="3.4" stroke-linecap="round" opacity="1"/>
<circle cx="180.0" cy="220.0" r="20" fill="#fff" stroke="#2f6fd6" stroke-width="2"/>
<text x="180.0" y="220.0" font-size="16" fill="#333" text-anchor="middle" dominant-baseline="central">x<tspan dy="4.8" font-size="11.5">0</tspan><tspan dy="-4.8">​</tspan></text>
<circle cx="420.0" cy="100.0" r="20" fill="#fff" stroke="#2f6fd6" stroke-width="2"/>
<text x="420.0" y="100.0" font-size="16" fill="#333" text-anchor="middle" dominant-baseline="central">y<tspan dy="4.8" font-size="11.5">1</tspan><tspan dy="-4.8">​</tspan></text>
<circle cx="420.0" cy="220.0" r="20" fill="#fff" stroke="#2f6fd6" stroke-width="2"/>
<text x="420.0" y="220.0" font-size="16" fill="#333" text-anchor="middle" dominant-baseline="central">y<tspan dy="4.8" font-size="11.5">2</tspan><tspan dy="-4.8">​</tspan></text>
<circle cx="420.0" cy="340.0" r="20" fill="#fff" stroke="#2f6fd6" stroke-width="2"/>
<text x="420.0" y="340.0" font-size="16" fill="#333" text-anchor="middle" dominant-baseline="central">y<tspan dy="4.8" font-size="11.5">3</tspan><tspan dy="-4.8">​</tspan></text>
<circle cx="640.0" cy="160.0" r="20" fill="#fff" stroke="#e07b16" stroke-width="2"/>
<text x="640.0" y="160.0" font-size="16" fill="#333" text-anchor="middle" dominant-baseline="central">x<tspan dy="4.8" font-size="11.5">1</tspan><tspan dy="-4.8">​</tspan></text>
<circle cx="640.0" cy="280.0" r="20" fill="#fff" stroke="#e07b16" stroke-width="2"/>
<text x="640.0" y="280.0" font-size="16" fill="#333" text-anchor="middle" dominant-baseline="central">x<tspan dy="4.8" font-size="11.5">2</tspan><tspan dy="-4.8">​</tspan></text>
<text x="40.0" y="40.0" font-size="16" fill="#2f6fd6" text-anchor="start" dominant-baseline="central" font-weight="bold" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">第一步（蓝）：星</text>
<text x="40.0" y="68.0" font-size="15" fill="#2f6fd6" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">X<tspan dy="4.5" font-size="10.8">0</tspan><tspan dy="-4.5">​</tspan>Y<tspan dy="4.5" font-size="10.8">1</tspan><tspan dy="-4.5">​</tspan> 是均匀随机的有向边，</text>
<text x="40.0" y="94.0" font-size="15" fill="#2f6fd6" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Y<tspan dy="4.5" font-size="10.8">2</tspan><tspan dy="-4.5">​</tspan>、Y<tspan dy="4.5" font-size="10.8">3</tspan><tspan dy="-4.5">​</tspan> 是 X<tspan dy="4.5" font-size="10.8">0</tspan><tspan dy="-4.5">​</tspan> 的独立随机邻点</text>
<text x="675.0" y="160.0" font-size="15" fill="#e07b16" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">X<tspan dy="4.5" font-size="10.8">1</tspan><tspan dy="-4.5">​</tspan> ～ X<tspan dy="4.5" font-size="10.8">0</tspan><tspan dy="-4.5">​</tspan> 在给定 (Y<tspan dy="4.5" font-size="10.8">1</tspan><tspan dy="-4.5">​</tspan>, Y<tspan dy="4.5" font-size="10.8">2</tspan><tspan dy="-4.5">​</tspan>) 下</text>
<text x="675.0" y="186.0" font-size="15" fill="#e07b16" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">的条件分布，独立地抽取</text>
<text x="675.0" y="280.0" font-size="15" fill="#e07b16" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">X<tspan dy="4.5" font-size="10.8">2</tspan><tspan dy="-4.5">​</tspan> ～ X<tspan dy="4.5" font-size="10.8">0</tspan><tspan dy="-4.5">​</tspan> 在给定 (Y<tspan dy="4.5" font-size="10.8">2</tspan><tspan dy="-4.5">​</tspan>, Y<tspan dy="4.5" font-size="10.8">3</tspan><tspan dy="-4.5">​</tspan>) 下</text>
<text x="675.0" y="306.0" font-size="15" fill="#e07b16" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">的条件分布，独立地抽取</text>
<text x="470.0" y="412.0" font-size="15" fill="#9a9a9a" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">x<tspan dy="4.5" font-size="10.8">0</tspan><tspan dy="-4.5">​</tspan> 与 y<tspan dy="4.5" font-size="10.8">1</tspan><tspan dy="-4.5">​</tspan>, y<tspan dy="4.5" font-size="10.8">2</tspan><tspan dy="-4.5">​</tspan>, y<tspan dy="4.5" font-size="10.8">3</tspan><tspan dy="-4.5">​</tspan> 全部相邻，所以“X<tspan dy="4.5" font-size="10.8">0</tspan><tspan dy="-4.5">​</tspan> 的条件拷贝”总能与指定的 Y 相邻</text></svg>