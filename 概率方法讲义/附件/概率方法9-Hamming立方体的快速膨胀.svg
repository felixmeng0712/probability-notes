<text x="272.0" y="60.0" font-size="14" fill="#9a9a9a" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">n = 36，横轴为重量，柱高为该重量的点所占比例</text>
<text x="74.0" y="380.0" font-size="14" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">B：重量小于 n/2，占比 ≤ 1/2（本例 0.43）</text>
<text x="74.0" y="406.0" font-size="14" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">B<tspan dy="4.2" font-size="10.1">t</tspan><tspan dy="-4.2">​</tspan> ∖ B：再膨胀 t = 5 层</text>
<text x="74.0" y="432.0" font-size="14" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">剩下的尾巴：≤ exp(−2t²/n)（本例 0.07）</text>
<text x="566.0" y="350.0" font-size="14" fill="#333" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0</text>
<text x="782.0" y="350.0" font-size="14" fill="#333" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">n/2</text>
<text x="998.0" y="350.0" font-size="14" fill="#333" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">n</text>
<text x="782.0" y="34.0" font-size="16" fill="#333" text-anchor="middle" dominant-baseline="central" font-weight="bold" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">定理 9.13：两步膨胀，从 ε 到 1 − ε</text>
<text x="782.0" y="60.0" font-size="14" fill="#9a9a9a" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">第一步用反证：A<tspan dy="4.2" font-size="10.1">t</tspan><tspan dy="-4.2">​</tspan> 的补集 A′ 离 A 超过 t</text>
<text x="584.0" y="380.0" font-size="14" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">A：占比 ε（本例 0.07）</text>
<text x="584.0" y="406.0" font-size="14" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">A<tspan dy="4.2" font-size="10.1">t</tspan><tspan dy="-4.2">​</tspan> ∖ A：膨胀 t = 5 后已过半（0.57）</text>
<text x="584.0" y="432.0" font-size="14" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">A<tspan dy="4.2" font-size="10.1">2t</tspan><tspan dy="-4.2">​</tspan> ∖ A<tspan dy="4.2" font-size="10.1">t</tspan><tspan dy="-4.2">​</tspan>：再膨胀 t，达到 1 − ε</text>
<text x="584.0" y="458.0" font-size="14" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">其余：离 A 超过 2t，占比 ≤ ε（0.03）</text></svg>