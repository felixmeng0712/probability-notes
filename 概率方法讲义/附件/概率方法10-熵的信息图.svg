<text x="545.0" y="50.0" font-size="20" fill="#e07b16" text-anchor="middle" dominant-baseline="central" font-weight="bold" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">H(Y)</text>
<text x="235.0" y="200.0" font-size="17" fill="#333" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">H(X | Y)</text>
<text x="380.0" y="200.0" font-size="17" fill="#333" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">I(X;Y)</text>
<text x="525.0" y="200.0" font-size="17" fill="#333" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">H(Y | X)</text>
<text x="380.0" y="378.0" font-size="15" fill="#333" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">并集：H(X,Y) = H(X) + H(Y | X) = H(Y) + H(X | Y)</text></svg>