<text x="690.0" y="280.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">每分裂一次，大小至少乘以 1 − ε/4</text>
