<text x="450.0" y="50.0" font-size="15" fill="#333" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">T：V∖I 中支配 I 的极小集合；p<tspan dy="4.5" font-size="10.8">i</tspan><tspan dy="-4.5">​</tspan> 是 t<tspan dy="4.5" font-size="10.8">i</tspan><tspan dy="-4.5">​</tspan> 的私有邻居（在 T 中只与 t<tspan dy="4.5" font-size="10.8">i</tspan><tspan dy="-4.5">​</tspan> 相邻）</text>
<text x="450.0" y="400.0" font-size="15" fill="#333" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">蓝：随机选出的 T' = {t<tspan dy="4.5" font-size="10.8">2</tspan><tspan dy="-4.5">​</tspan>, t<tspan dy="4.5" font-size="10.8">3</tspan><tspan dy="-4.5">​</tspan>, t<tspan dy="4.5" font-size="10.8">4</tspan><tspan dy="-4.5">​</tspan>}；橙：Q（到 T' 的邻居数为奇数）</text>
<text x="450.0" y="432.0" font-size="15" fill="#333" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">绿：P'（t<tspan dy="4.5" font-size="10.8">2</tspan><tspan dy="-4.5">​</tspan>、t<tspan dy="4.5" font-size="10.8">3</tspan><tspan dy="-4.5">​</tspan> 的度数原为偶数，各加上私有邻居翻转奇偶）；实线：H 中的边</text></svg>