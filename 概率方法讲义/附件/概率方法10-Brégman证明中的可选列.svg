<text x="530.0" y="110.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">第 i = 3 行有 d<tspan dy="4.5" font-size="10.8">i</tspan><tspan dy="-4.5">​</tspan> = 4 个 1（列 1、2、4、6）。</text>
<text x="530.0" y="150.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">σ 是排列，这四列各被一行占用（圈出的位置）：</text>
<text x="530.0" y="190.0" font-size="15" fill="#2f6fd6" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">列 1 ← 行 3（i 自己，蓝圈）</text>
<text x="530.0" y="230.0" font-size="15" fill="#e07b16" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">列 2 ← 行 1，列 4 ← 行 2，列 6 ← 行 4（橙圈）</text>
<text x="530.0" y="270.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">于是 R<tspan dy="4.5" font-size="10.8">i</tspan><tspan dy="-4.5">​</tspan> = {1, 2, 3, 4}，共 d<tspan dy="4.5" font-size="10.8">i</tspan><tspan dy="-4.5">​</tspan> 行。</text>
<text x="530.0" y="310.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">随机顺序下 i 在 R<tspan dy="4.5" font-size="10.8">i</tspan><tspan dy="-4.5">​</tspan> 中的名次 k 均匀分布，</text>
<text x="530.0" y="350.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">N<tspan dy="4.5" font-size="10.8">i</tspan><tspan dy="-4.5">​</tspan> = d<tspan dy="4.5" font-size="10.8">i</tspan><tspan dy="-4.5">​</tspan> − (k − 1) 在 {1, 2, 3, 4} 上均匀分布。</text>
<text x="530.0" y="390.0" font-size="15" fill="#9a9a9a" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">例：R<tspan dy="4.5" font-size="10.8">i</tspan><tspan dy="-4.5">​</tspan> 的相对次序为 2, 3, 1, 4 时 k = 2，</text>
<text x="530.0" y="430.0" font-size="15" fill="#9a9a9a" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">行 2 先占用了列 4，剩下列 1、2、6，N<tspan dy="4.5" font-size="10.8">i</tspan><tspan dy="-4.5">​</tspan> = 3。</text>
<text x="304.0" y="458.0" font-size="14" fill="#9a9a9a" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">蓝底：第 i 行与它的 1 所在的列；虚线圈：与第 i 行无关的 σ 位置</text></svg>