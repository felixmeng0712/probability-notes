<text x="720.0" y="372.0" font-size="15" fill="#333" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">四点的取值是 K<tspan dy="4.5" font-size="10.8">2,2</tspan><tspan dy="-4.5">​</tspan> 的一个独立集，</text>
