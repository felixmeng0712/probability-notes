<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img"><title>Steiner 三元系计数：s 成为 X_ij 的候选，需要两个三元组的六条边都排在 ij 之后</title><rect width="900" height="560" fill="#ffffff"/><style>text{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",Arial,sans-serif}</style><defs></defs><line x1="300.0" y1="300.0" x2="410.0" y2="120.0" stroke="#9a9a9a" stroke-width="2.4" stroke-linecap="round" opacity="1" stroke-dasharray="7 5"/>
<line x1="520.0" y1="300.0" x2="410.0" y2="120.0" stroke="#9a9a9a" stroke-width="2.4" stroke-linecap="round" opacity="1" stroke-dasharray="7 5"/>
<line x1="300.0" y1="300.0" x2="410.0" y2="440.0" stroke="#e07b16" stroke-width="3.2" stroke-linecap="round" opacity="1"/>
<line x1="300.0" y1="300.0" x2="170.0" y2="470.0" stroke="#e07b16" stroke-width="3.2" stroke-linecap="round" opacity="1"/>
<line x1="410.0" y1="440.0" x2="170.0" y2="470.0" stroke="#e07b16" stroke-width="3.2" stroke-linecap="round" opacity="1"/>
<line x1="520.0" y1="300.0" x2="410.0" y2="440.0" stroke="#e07b16" stroke-width="3.2" stroke-linecap="round" opacity="1"/>
<line x1="520.0" y1="300.0" x2="650.0" y2="470.0" stroke="#e07b16" stroke-width="3.2" stroke-linecap="round" opacity="1"/>
<line x1="410.0" y1="440.0" x2="650.0" y2="470.0" stroke="#e07b16" stroke-width="3.2" stroke-linecap="round" opacity="1"/>
<line x1="300.0" y1="300.0" x2="520.0" y2="300.0" stroke="#2f6fd6" stroke-width="5" stroke-linecap="round" opacity="1"/>
<circle cx="300.0" cy="300.0" r="18" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="300.0" y="300.0" font-size="17" fill="#333" text-anchor="middle" dominant-baseline="central">i</text>
<circle cx="520.0" cy="300.0" r="18" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="520.0" y="300.0" font-size="17" fill="#333" text-anchor="middle" dominant-baseline="central">j</text>
<circle cx="410.0" cy="120.0" r="18" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="410.0" y="120.0" font-size="17" fill="#333" text-anchor="middle" dominant-baseline="central">k</text>
<circle cx="410.0" cy="440.0" r="18" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="410.0" y="440.0" font-size="17" fill="#333" text-anchor="middle" dominant-baseline="central">s</text>
<circle cx="170.0" cy="470.0" r="18" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="170.0" y="470.0" font-size="17" fill="#333" text-anchor="middle" dominant-baseline="central">a</text>
<circle cx="650.0" cy="470.0" r="18" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="650.0" y="470.0" font-size="17" fill="#333" text-anchor="middle" dominant-baseline="central">b</text>
<text x="410.0" y="285.0" font-size="17" fill="#2f6fd6" text-anchor="middle" dominant-baseline="central" font-weight="bold" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">ij</text>
<text x="300.0" y="45.0" font-size="16" fill="#9a9a9a" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">三元组 {i, j, k}：ij 首先揭示</text>
<text x="300.0" y="72.0" font-size="15" fill="#9a9a9a" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">即 y<tspan dy="4.5" font-size="10.8">ik</tspan><tspan dy="-4.5">​</tspan>, y<tspan dy="4.5" font-size="10.8">jk</tspan><tspan dy="-4.5">​</tspan> &lt; y<tspan dy="4.5" font-size="10.8">ij</tspan><tspan dy="-4.5">​</tspan>，概率 y<tspan dy="4.5" font-size="10.8">ij</tspan><tspan dy="-4.5">​</tspan>²</text>
<text x="110.0" y="528.0" font-size="15" fill="#e07b16" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">三元组 {i, s, a}，a = X<tspan dy="4.5" font-size="10.8">is</tspan><tspan dy="-4.5">​</tspan></text>
<text x="710.0" y="528.0" font-size="15" fill="#e07b16" text-anchor="end" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">三元组 {j, s, b}，b = X<tspan dy="4.5" font-size="10.8">js</tspan><tspan dy="-4.5">​</tspan></text>
<text x="620.0" y="230.0" font-size="15" fill="#e07b16" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">橙色六条边都排在 ij 之后，</text>
<text x="620.0" y="256.0" font-size="15" fill="#e07b16" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">s 才仍是 X<tspan dy="4.5" font-size="10.8">ij</tspan><tspan dy="-4.5">​</tspan> 的候选：</text>
<text x="620.0" y="282.0" font-size="15" fill="#e07b16" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">给定 y<tspan dy="4.5" font-size="10.8">ij</tspan><tspan dy="-4.5">​</tspan>，概率为 y<tspan dy="4.5" font-size="10.8">ij</tspan><tspan dy="-4.5">​</tspan>⁶</text></svg>