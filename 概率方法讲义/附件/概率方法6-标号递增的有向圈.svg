<text x="540.0" y="110.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">k = 3，圈内数字是标号 x<tspan dy="4.5" font-size="10.8">v</tspan><tspan dy="-4.5">​</tspan> ∈ ℤ/3</text>
<text x="540.0" y="160.0" font-size="15" fill="#2f6fd6" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">蓝边：标号恰好加 1</text>
<text x="540.0" y="210.0" font-size="15" fill="#9a9a9a" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">灰边：v 的其他出邻居</text>
<text x="540.0" y="270.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">若每个点都有“加 1”的出边，</text>
<text x="540.0" y="295.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">一直走下去必回到走过的点；</text>
<text x="540.0" y="320.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">绕圈一周标号回到原值，</text>
<text x="540.0" y="345.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">所以圈长是 k 的倍数</text></svg>