<text x="340.0" y="156.0" font-size="15" fill="#333" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">性质 (*)：剩余 ≥ m 个点时总能取出一块</text>
<text x="730.0" y="130.0" font-size="15" fill="#9a9a9a" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">剩下 &lt; m 个点</text>
<text x="730.0" y="156.0" font-size="15" fill="#9a9a9a" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">每点一种新颜色</text>
<text x="450.0" y="210.0" font-size="16" fill="#333" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">颜色数 ≤ n/k + m，取 m = n/(log n)² 即为 (1+o(1)) n/(2log<tspan dy="4.8" font-size="11.5">2</tspan><tspan dy="-4.8">​</tspan> n)</text></svg>