<text x="560.0" y="120.0" font-size="14" fill="#9b3fb5" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">公共分量 √α·u，所有向量共有</text>
<text x="560.0" y="156.0" font-size="14" fill="#2f6fd6" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">噪声 w<tspan dy="4.2" font-size="10.1">i</tspan><tspan dy="-4.2">​</tspan>：与 u 正交，长约 √(1−α)</text>
<text x="560.0" y="192.0" font-size="14" fill="#9a9a9a" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">v<tspan dy="4.2" font-size="10.1">i</tspan><tspan dy="-4.2">​</tspan> = √α·u + w<tspan dy="4.2" font-size="10.1">i</tspan><tspan dy="-4.2">​</tspan>（单位向量）</text>
<text x="520.0" y="260.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">高维中独立的噪声两两近似正交，</text>
<text x="520.0" y="288.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">所以 v<tspan dy="4.5" font-size="10.8">i</tspan><tspan dy="-4.5">​</tspan> · v<tspan dy="4.5" font-size="10.8">j</tspan><tspan dy="-4.5">​</tspan> ≈ α + w<tspan dy="4.5" font-size="10.8">i</tspan><tspan dy="-4.5">​</tspan> · w<tspan dy="4.5" font-size="10.8">j</tspan><tspan dy="-4.5">​</tspan> ≈ α</text>
<text x="520.0" y="330.0" font-size="14" fill="#9a9a9a" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">灰色椭圆：与 u 正交的超平面</text>
