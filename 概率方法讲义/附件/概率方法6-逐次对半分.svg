<text x="520.0" y="55.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">D<tspan dy="4.5" font-size="10.8">0</tspan><tspan dy="-4.5">​</tspan> = k，η<tspan dy="4.5" font-size="10.8">0</tspan><tspan dy="-4.5">​</tspan> = 0</text>
<text x="520.0" y="135.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">D<tspan dy="4.5" font-size="10.8">1</tspan><tspan dy="-4.5">​</tspan> = k/2，η<tspan dy="4.5" font-size="10.8">1</tspan><tspan dy="-4.5">​</tspan> = η<tspan dy="4.5" font-size="10.8">0</tspan><tspan dy="-4.5">​</tspan> + 2√(3 ln D<tspan dy="4.5" font-size="10.8">0</tspan><tspan dy="-4.5">​</tspan> / D<tspan dy="4.5" font-size="10.8">0</tspan><tspan dy="-4.5">​</tspan>)</text>
<text x="520.0" y="215.0" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">D<tspan dy="4.5" font-size="10.8">2</tspan><tspan dy="-4.5">​</tspan> = k/4，η<tspan dy="4.5" font-size="10.8">2</tspan><tspan dy="-4.5">​</tspan> = η<tspan dy="4.5" font-size="10.8">1</tspan><tspan dy="-4.5">​</tspan> + 2√(3 ln D<tspan dy="4.5" font-size="10.8">1</tspan><tspan dy="-4.5">​</tspan> / D<tspan dy="4.5" font-size="10.8">1</tspan><tspan dy="-4.5">​</tspan>)</text>
<text x="520.0" y="318.0" font-size="15" fill="#2a9d4b" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">第 t 层：部分数翻倍了 t 次，彼此没有边，</text>
<text x="520.0" y="343.0" font-size="15" fill="#2a9d4b" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">每点出度 ≥ (1 − η<tspan dy="4.5" font-size="10.8">t</tspan><tspan dy="-4.5">​</tspan>) D<tspan dy="4.5" font-size="10.8">t</tspan><tspan dy="-4.5">​</tspan> ≥ D*/4 > 0</text>
<text x="460.0" y="400.0" font-size="15" fill="#9a9a9a" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">误差项随 D<tspan dy="4.5" font-size="10.8">j</tspan><tspan dy="-4.5">​</tspan> 增大而变小，η<tspan dy="4.5" font-size="10.8">j</tspan><tspan dy="-4.5">​</tspan> 之和是收敛级数，总和 ≤ 1/2</text></svg>