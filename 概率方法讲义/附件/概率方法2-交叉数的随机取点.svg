<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img"><title>随机保留顶点时一个交叉点存活的条件</title><rect width="880" height="420" fill="#ffffff"/><style>text{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",Arial,sans-serif}</style><defs></defs><line x1="92.0" y1="99.0" x2="348.0" y2="291.0" stroke="#2f6fd6" stroke-width="3" stroke-linecap="round" opacity="1"/>
<line x1="92.0" y1="291.0" x2="348.0" y2="99.0" stroke="#2f6fd6" stroke-width="3" stroke-linecap="round" opacity="1"/>
<circle cx="220.0" cy="195.0" r="7" stroke="#d43c3c" stroke-width="1.3" fill="#d43c3c"/>
<line x1="532.0" y1="99.0" x2="788.0" y2="291.0" stroke="#d0d0d0" stroke-width="2.4" stroke-linecap="round" opacity="1" stroke-dasharray="7 6"/>
<line x1="532.0" y1="291.0" x2="788.0" y2="99.0" stroke="#2f6fd6" stroke-width="3" stroke-linecap="round" opacity="1"/>
<circle cx="80.0" cy="90.0" r="15" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="80.0" y="90.0" font-size="15" fill="#333" text-anchor="middle" dominant-baseline="central">a</text>
<circle cx="360.0" cy="300.0" r="15" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="360.0" y="300.0" font-size="15" fill="#333" text-anchor="middle" dominant-baseline="central">b</text>
<circle cx="80.0" cy="300.0" r="15" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="80.0" y="300.0" font-size="15" fill="#333" text-anchor="middle" dominant-baseline="central">c</text>
<circle cx="360.0" cy="90.0" r="15" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="360.0" y="90.0" font-size="15" fill="#333" text-anchor="middle" dominant-baseline="central">d</text>
<text x="220.0" y="370.0" font-size="16" fill="#2f6fd6" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">a, b, c, d 都保留：交叉点留在 G′ 中</text>
<circle cx="520.0" cy="90.0" r="15" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="520.0" y="90.0" font-size="15" fill="#333" text-anchor="middle" dominant-baseline="central">a</text>
<circle cx="800.0" cy="300.0" r="15" fill="#fff" stroke="#9a9a9a" stroke-width="2" stroke-dasharray="4 3"/>
<text x="800.0" y="300.0" font-size="15" fill="#9a9a9a" text-anchor="middle" dominant-baseline="central">b</text>
<circle cx="520.0" cy="300.0" r="15" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="520.0" y="300.0" font-size="15" fill="#333" text-anchor="middle" dominant-baseline="central">c</text>
<circle cx="800.0" cy="90.0" r="15" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="800.0" y="90.0" font-size="15" fill="#333" text-anchor="middle" dominant-baseline="central">d</text>
<text x="660.0" y="370.0" font-size="16" fill="#9a9a9a" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">b 被删去：边 ab 消失，交叉点随之消失</text>
<text x="440.0" y="30.0" font-size="17" fill="#333" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">每个顶点独立地以概率 p 保留；交叉点存活的概率是 p⁴</text></svg>